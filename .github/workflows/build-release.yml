name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - name: Test Windows Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o happ.exe ./cmd/happ
      - name: Isolated TUN and routing integration
        run: |
          # Run the user namespace test as root on runners that restrict unprivileged user namespaces.
          sudo env PATH="$PATH" GOTOOLCHAIN=local bash tests/netns.sh
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            bin: happ
            format: tar.gz
          - os: linux
            arch: arm64
            bin: happ
            format: tar.gz
          - os: darwin
            arch: amd64
            bin: happ
            format: tar.gz
          - os: darwin
            arch: arm64
            bin: happ
            format: tar.gz
          - os: windows
            arch: amd64
            bin: happ.exe
            format: zip
          - os: windows
            arch: arm64
            bin: happ.exe
            format: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${{ matrix.bin }}" ./cmd/happ
          cd dist
          if [ "${{ matrix.format }}" = "zip" ]; then
            sudo apt-get update && sudo apt-get install -y zip
            zip "happ-${{ matrix.os }}-${{ matrix.arch }}.zip" "${{ matrix.bin }}"
          else
            tar czf "happ-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "${{ matrix.bin }}"
          fi
          sha256sum *.* > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: happ-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: cat artifacts/*/checksums.txt | sort -u > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'dev') || contains(github.ref, 'beta') }}
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
            checksums.txt
